name: Dev

on: ['push', 'pull_request']

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build and Test
        run: |
            mkdir -p build
            cd build
            cmake ..
            cmake --build .
            ctest --output-on-failure