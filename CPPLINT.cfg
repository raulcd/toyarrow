# We use #pragma once rather than include guards.
filter = -build/header_guard
# clang-format owns include layout (IncludeBlocks: Preserve).
filter = -build/include_order
filter = -build/include_what_you_use
# Warns aggressively on legitimate static_cast/reinterpret_cast usage.
filter = -readability/casting
filter = -runtime/references
# Let clang-format do the job for whitespace.
filter = -whitespace/comments
filter = -whitespace/braces

# Match ColumnLimit in .clang-format.
linelength = 90
